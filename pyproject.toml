[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caio"
version = "0.3.0"
description = "Cryptographically Attested Internet Overlay -- reference prototype for cryptographic lineage, capability leasing, and multi-perspective divergence defense for autonomous agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kaymyg" }]
dependencies = [
    "cryptography>=50.0.2,<51",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=7.1.0"]

[tool.setuptools.packages.find]
include = ["caio*"]
